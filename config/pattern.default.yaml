# Calibration pattern geometry (mm). Safe to tune; see docs/method.md.
pattern:
  reference_tool: 0
  tools: [1, 2, 3]
  include_control: true        # T0-vs-T0 cell: measures the bias of the method itself
  pitch_mm: 1.2                # reference (T0) grating pitch
  vernier_ratio: 0.95          # measured-tool pitch = pitch_mm * vernier_ratio (1.0 = equal pitches)
  grating_length_mm: 30.0
  line_length_mm: 5.0
  half_gap_mm: 0.8
  cell_spacing_mm: 6.0
  line_width_mm: 0.45
  layer_height_mm: 0.25
  fiducial_diameter_mm: 6.0
  orientation_dot_diameter_mm: 3.0
  fiducial_margin_mm: 5.0
  prime_lines: true
  prime_line_length_mm: 40.0
  center_on_bed_mm: [135.0, 135.0]   # TO VERIFY ON HARDWARE (depends on bed size and camera view)

measure:
  rect_px_per_mm: 20.0
  bands: 6
  end_trim_fraction: 0.15
  max_offset_mm: 0.5
  max_coarse_disagreement: 0.35
  max_fiducial_reproj_px: 2.5
  min_modulation_snr: 2.0
  min_contrast: 0.03
  max_shading_sensitivity: 3.0       # TO VERIFY ON HARDWARE (chamber lighting)
  max_shading_sensitivity_difference: 1.0   # TO VERIFY ON HARDWARE
  sigma_floor_mm: 0.006
  max_sigma_mm: 0.02
  max_phase_vernier_disagreement_mm: 0.03
  max_control_bias_mm: 0.03
